<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="保质期管家">
<meta name="theme-color" content="#4F46E5">
<meta name="description" content="食品保质期管理工具 - 轻松追踪食材新鲜度">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>保质期管家</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-primary: #4F46E5;
  --color-primary-light: #EEF2FF;
  --color-danger: #DC2626;
  --color-danger-bg: #FEF2F2;
  --color-danger-border: #FECACA;
  --color-warning: #EA580C;
  --color-warning-bg: #FFF7ED;
  --color-warning-border: #FED7AA;
  --color-caution: #CA8A04;
  --color-caution-bg: #FEFCE8;
  --color-caution-border: #FEF08A;
  --color-safe: #16A34A;
  --color-safe-bg: #F0FDF4;
  --color-safe-border: #BBF7D0;
  --color-bg: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-text: #1E293B;
  --color-text-secondary: #64748B;
  --color-border: #E2E8F0;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  color-scheme: light;
  -webkit-user-select: none;
}

.app-container {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  position: relative;
}

/* ── Header ── */
.header {
  background: var(--color-surface);
  padding: calc(12px + var(--safe-top)) 20px 14px;
  text-align: center;
  border-bottom: 1px solid var(--color-border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-logo { font-size: 28px; display: block; margin-bottom: 2px; }
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
.header .subtitle { font-size: 12px; color: var(--color-text-secondary); }

/* ── User Bar ── */
.user-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
  font-size: 11px;
  color: var(--color-text-secondary);
}
.user-bar.hidden { display: none; }
.user-bar .user-email { font-weight: 600; }
.user-bar .btn-logout {
  background: none;
  border: 1px solid var(--color-border);
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 10px;
  cursor: pointer;
  color: var(--color-text-secondary);
}
.user-bar .btn-logout:active { background: var(--color-danger-bg); color: var(--color-danger); }
.sync-pill {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--color-safe-bg);
  color: var(--color-safe);
  white-space: nowrap;
}
.sync-pill.offline { background: var(--color-warning-bg); color: var(--color-warning); }
.sync-pill.error { background: var(--color-danger-bg); color: var(--color-danger); }
.sync-pill.local { background: var(--color-border); color: var(--color-text-secondary); }

/* ── Content ── */
.content { flex: 1; padding: 16px 20px; padding-bottom: calc(88px + var(--safe-bottom)); }
.tab-content { display: none; animation: fadeIn .25s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── List Header ── */
.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.list-count { font-size: 13px; color: var(--color-text-secondary); font-weight: 600; }
.btn-clean {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-danger);
  background: var(--color-danger-bg);
  border: 1px solid var(--color-danger-border);
  padding: 6px 12px;
  border-radius: 99px;
  cursor: pointer;
  transition: all .2s;
}
.btn-clean:active { transform: scale(.96); opacity: .8; }
.btn-clean.hidden { display: none; }

/* ── Form ── */
.form-section { margin-bottom: 20px; }
.form-section label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  margin-bottom: 6px;
  letter-spacing: .3px;
  text-transform: uppercase;
}
.form-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 16px;
  background: var(--color-surface);
  color: var(--color-text);
  transition: all .2s;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
}
.form-input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.1);
}
.form-input::placeholder { color: #94A3B8; }
.hint-text { font-weight: 400; font-size: 12px; color: #94A3B8; text-transform: none; }

/* Shelf-life unit selector */
.shelf-life-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.shelf-life-row .shelf-life-value {
  flex: 1;
  min-width: 0;
}
.unit-selector {
  display: flex;
  background: var(--color-border);
  border-radius: var(--radius-xs);
  padding: 3px;
  flex-shrink: 0;
}
.unit-btn {
  padding: 8px 14px;
  border: none;
  background: transparent;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all .2s;
  min-width: 36px;
  min-height: 44px;
  text-align: center;
}
.unit-btn.active {
  background: var(--color-surface);
  color: var(--color-primary);
  box-shadow: var(--shadow);
}
.unit-btn:active { transform: scale(.95); }

/* Expiry Preview */
.expiry-preview {
  background: var(--color-primary-light);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--color-primary);
  font-weight: 600;
}
.expiry-preview .preview-icon { font-size: 18px; }
.expiry-preview.hidden { display: none; }

/* Submit Button */
.btn-submit {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  background: var(--color-primary);
  color: #fff;
  transition: all .2s;
  box-shadow: 0 4px 12px rgba(79,70,229,.3);
  letter-spacing: -.2px;
}
.btn-submit:active { transform: scale(.98); opacity: .9; }

/* ── Food Cards ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--color-text-secondary);
}
.empty-state .icon { font-size: 64px; display: block; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; font-weight: 700; color: var(--color-text); margin-bottom: 6px; }
.empty-state p { font-size: 14px; }

.food-list { display: flex; flex-direction: column; gap: 10px; }

.food-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  border-left: 4px solid transparent;
  transition: all .2s;
  position: relative;
  overflow: hidden;
  cursor: default;
}
.food-card:active { transform: scale(.99); }

.food-card.expired { border-left-color: #991B1B; background: #FEE2E2; }
.food-card.danger  { border-left-color: var(--color-danger); background: var(--color-danger-bg); }
.food-card.warning { border-left-color: var(--color-warning); background: var(--color-warning-bg); }
.food-card.caution { border-left-color: var(--color-caution); background: var(--color-caution-bg); }
.food-card.safe    { border-left-color: var(--color-safe); background: var(--color-safe-bg); }

.food-card.expired .card-name { text-decoration: line-through; color: #991B1B; }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.card-name {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.2px;
  flex: 1;
  margin-right: 8px;
}
.card-tag {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  white-space: nowrap;
  letter-spacing: .2px;
  flex-shrink: 0;
}
.expired .card-tag { background: #991B1B; color: #fff; }
.danger  .card-tag { background: var(--color-danger); color: #fff; }
.warning .card-tag { background: var(--color-warning); color: #fff; }
.caution .card-tag { background: var(--color-caution); color: #fff; }
.safe    .card-tag { background: var(--color-safe); color: #fff; }

.card-dates {
  font-size: 13px;
  color: var(--color-text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-bottom: 10px;
}
.card-dates span { display: inline-flex; align-items: center; gap: 3px; }

.card-actions { display: flex; gap: 8px; }

.btn-sm {
  padding: 8px 14px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  background: var(--color-surface);
  color: var(--color-text-secondary);
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
}
.btn-sm:active { transform: scale(.96); }
.btn-sm.eat { color: var(--color-safe); border-color: var(--color-safe-border); }
.btn-sm.eat:active { background: var(--color-safe); color: #fff; border-color: var(--color-safe); }
.btn-sm.delete { color: var(--color-danger); border-color: var(--color-danger-border); }
.btn-sm.delete:active { background: var(--color-danger); color: #fff; border-color: var(--color-danger); }

/* ── Card Edit Button (⋮) ── */
.btn-edit {
  width: 36px;
  height: 36px;
  margin: -5px -4px 0 4px;
  padding: 0;
  border: 1.5px solid var(--color-border);
  border-radius: 99px;
  background: rgba(255,255,255,.65);
  color: var(--color-text-secondary);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .2s;
  position: relative;
}
.btn-edit::after { content: ''; position: absolute; inset: -6px; } /* 扩大手机触控区域 */
.btn-edit:hover { background: #fff; color: var(--color-primary); border-color: var(--color-primary); }
.btn-edit:active { transform: scale(.9); background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }

/* ── Edit Toolbar ── */
.edit-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.edit-toolbar.hidden { display: none; }
.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 8px 14px;
  min-height: 40px;
  border: 1.5px solid var(--color-border);
  border-radius: 99px;
  background: var(--color-surface);
  color: var(--color-text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.btn-back:active { transform: scale(.96); background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }
.edit-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.2px;
}

/* ── Bottom Nav ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,.92);
  border-top: 1px solid var(--color-border);
  display: flex;
  padding: 6px 20px;
  padding-bottom: calc(6px + var(--safe-bottom));
  gap: 8px;
  z-index: 10;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.bottom-nav .nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 6px;
  border: none;
  background: transparent;
  color: var(--color-text-secondary);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius-xs);
  transition: all .2s;
  position: relative;
  min-height: 44px;
  justify-content: center;
}
.bottom-nav .nav-item.active { color: var(--color-primary); }
.bottom-nav .nav-item .nav-icon { font-size: 22px; position: relative; }
.bottom-nav .nav-item .nav-badge {
  position: absolute;
  top: -4px;
  right: -14px;
  background: var(--color-danger);
  color: #fff;
  font-size: 10px;
  min-width: 18px;
  height: 18px;
  border-radius: 99px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1;
}

/* ── Toast ── */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-120px);
  background: #1E293B;
  color: #fff;
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 600;
  z-index: 100;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── Confirm Dialog ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn .2s ease;
}
.overlay.hidden { display: none; }
.dialog {
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: 24px;
  width: calc(100% - 48px);
  max-width: 340px;
  text-align: center;
  box-shadow: var(--shadow-lg);
}
.dialog h3 { font-size: 17px; margin-bottom: 8px; }
.dialog p { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 20px; }
.dialog-btns { display: flex; gap: 10px; }
.dialog-btns button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
}
.dialog-btns .btn-cancel { background: var(--color-border); color: var(--color-text); }
.dialog-btns .btn-cancel:active { opacity: .7; }
.dialog-btns .btn-confirm { background: var(--color-danger); color: #fff; }
.dialog-btns .btn-confirm:active { opacity: .8; }
.dialog-btns .btn-primary { background: var(--color-primary); color: #fff; }
.dialog-btns .btn-primary:active { opacity: .8; }

/* ── Auth Screen ── */
.auth-screen {
  position: fixed;
  inset: 0;
  background: var(--color-bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-screen.hidden { display: none; }
.auth-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: 32px 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: var(--shadow-lg);
}
.auth-card .auth-logo { text-align: center; margin-bottom: 20px; }
.auth-card .auth-logo .icon { font-size: 48px; }
.auth-card .auth-logo h2 { font-size: 20px; font-weight: 700; margin-top: 8px; }
.auth-card .auth-logo .desc { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
.auth-tabs {
  display: flex;
  background: var(--color-border);
  border-radius: var(--radius-xs);
  padding: 3px;
  margin-bottom: 20px;
}
.auth-tabs button {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all .2s;
  min-height: 44px;
}
.auth-tabs button.active {
  background: var(--color-surface);
  color: var(--color-primary);
  box-shadow: var(--shadow);
}
.auth-field { margin-bottom: 14px; }
.auth-field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  margin-bottom: 4px;
  text-transform: none;
}
.auth-field input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 16px;
  background: var(--color-surface);
  color: var(--color-text);
  outline: none;
  transition: border-color .2s;
}
.auth-field input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.1);
}
.auth-error {
  font-size: 13px;
  color: var(--color-danger);
  text-align: center;
  margin-bottom: 12px;
  min-height: 18px;
}
.btn-auth {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: var(--color-primary);
  color: #fff;
  transition: all .2s;
  min-height: 44px;
}
.btn-auth:active { transform: scale(.98); opacity: .9; }
.btn-auth:disabled { opacity: .6; pointer-events: none; }
.btn-offline {
  width: 100%;
  padding: 12px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--color-text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  min-height: 44px;
  transition: all .2s;
}
.btn-offline:hover { border-color: #CBD5E1; color: var(--color-text); }
.btn-offline:active { transform: scale(.98); background: var(--color-primary-light); border-color: var(--color-primary); color: var(--color-primary); }
.auth-footer {
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
  color: var(--color-text-secondary);
}
.auth-footer button {
  background: none;
  border: none;
  color: var(--color-primary);
  font-weight: 700;
  cursor: pointer;
  font-size: inherit;
  text-decoration: underline;
}

/* ── Responsive ── */
@media (min-width: 481px) {
  .app-container {
    border-left: 1px solid var(--color-border);
    border-right: 1px solid var(--color-border);
  }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header class="header">
    <span class="header-logo">🥬</span>
    <h1>保质期管家</h1>
    <p class="subtitle">食材新鲜，一目了然</p>
    <div class="user-bar hidden" id="user-bar">
      <span class="sync-pill local" id="sync-pill">本机模式</span>
      <span class="user-email" id="user-email"></span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="content">
    <!-- Add Food Tab -->
    <section class="tab-content active" id="tab-add">
      <div class="edit-toolbar hidden" id="edit-toolbar">
        <button class="btn-back" onclick="cancelEdit()">‹ 返回列表</button>
        <span class="edit-title">✏️ 编辑菜品</span>
      </div>

      <div class="form-section">
        <label>🥘 菜品名称</label>
        <input type="text" class="form-input" id="food-name"
               placeholder="请输入菜品名称…" maxlength="30" autocomplete="off">
      </div>

      <div class="form-section">
        <label>🏭 生产日期 <span class="hint-text">（选填，清空则仅记录到期日）</span></label>
        <input type="date" class="form-input" id="prod-date">
      </div>

      <div class="form-section">
        <label>⏳ 保质期</label>
        <div class="shelf-life-row">
          <input type="number" class="form-input shelf-life-value" id="shelf-life"
                 placeholder="例如：7" min="1" max="3650" inputmode="numeric">
          <div class="unit-selector" id="shelf-life-unit">
            <button type="button" class="unit-btn active" data-unit="day">天</button>
            <button type="button" class="unit-btn" data-unit="month">月</button>
            <button type="button" class="unit-btn" data-unit="year">年</button>
          </div>
        </div>
      </div>

      <div class="expiry-preview hidden" id="expiry-preview">
        <span class="preview-icon">📆</span>

<script>
// ═══════════════════════════════════════════
// 保质期管家 — Food Expiry Tracker PWA
// Cloud Sync powered by Supabase
// ═══════════════════════════════════════════

// ── Config ──
// !! 替换为你的 Supabase 项目信息（在 supabase.com 项目设置 → API 中获取）
const SUPABASE_URL = 'https://rquitlqknltflapwmrzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m9egWLDQlnlZNHLHJLrvDA_mU1PfP1P';

const STORAGE_KEY = 'food-expiry.v1';       // 本地缓存（云同步后仍保留作为离线兜底）
const TOMBSTONE_KEY = 'food-expiry.deleted'; // 待同步的删除记录
const SYNC_META_KEY = 'food-expiry.meta';    // 同步元数据

let supabase = null;
let items = [];
let pendingDeleteId = null;
let editingId = null;        // 正在编辑的菜品 id（null = 添加模式）
let session = null;
let tombstones = [];   // [{id, deletedAt}]
let syncMeta = null;   // {userId, lastSyncedAt, migrationHandled}
let authMode = 'login'; // 'login' | 'register'

// ── Date Utilities (UTC-based, timezone-safe) ──

function parseISO(iso) {
  const [y, m, d] = iso.split('-');
  return [+y, +m, +d];
}

function toISODate(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function todayISO() { return toISODate(new Date()); }

function daysUntil(expiryISO) {
  const [ty, tm, td] = parseISO(todayISO());
  const [ey, em, ed] = parseISO(expiryISO);
  return Math.round((Date.UTC(ey, em - 1, ed) - Date.UTC(ty, tm - 1, td)) / 86400000);
}

function addDaysISO(iso, n) {
  const [y, m, d] = parseISO(iso);
  return toISODate(new Date(Date.UTC(y, m - 1, d + n)));
}

function addTimeISO(iso, value, unit) {
  if (!value || value <= 0) return iso;
  const [y, m, d] = parseISO(iso);
  const p = n => String(n).padStart(2, '0');
  if (unit === 'day') return addDaysISO(iso, value);
  if (unit === 'month') {
    const totalMonths = m - 1 + value;
    const newYear = y + Math.floor(totalMonths / 12);
    const newMonth = (totalMonths % 12 + 12) % 12;
    const daysInNewMonth = new Date(Date.UTC(newYear, newMonth + 1, 0)).getUTCDate();
    return `${newYear}-${p(newMonth + 1)}-${p(Math.min(d, daysInNewMonth))}`;
  }
  if (unit === 'year') {
    const newYear = y + value;
    const daysInMonth = new Date(Date.UTC(newYear, m, 0)).getUTCDate();
    return `${newYear}-${p(m)}-${p(Math.min(d, daysInMonth))}`;
  }
  return iso;
}

function computeShelfLife(prodISO, expiryISO, unit) {
  const [py, pm, pd] = parseISO(prodISO);
  const [ey, em, ed] = parseISO(expiryISO);
  const totalDays = Math.round((Date.UTC(ey, em - 1, ed) - Date.UTC(py, pm - 1, pd)) / 86400000);
  if (unit === 'day') return Math.max(0, totalDays);
  if (unit === 'year') return Math.max(0, Math.round(totalDays / 365));
  if (unit === 'month') return Math.max(0, Math.round(totalDays / 30.4375));
  return Math.max(0, totalDays);
}

// ── Status helpers ──

function daysLeftLabel(d) {
  if (d < 0) return '已过期 ' + Math.abs(d) + ' 天';
  if (d === 0) return '今天到期';
  if (d === 1) return '明天到期';
  return '剩 ' + d + ' 天';
}

function getLevel(d) {
  if (d < 0) return 'expired';
  if (d <= 3) return 'danger';
  if (d <= 7) return 'warning';
  if (d <= 30) return 'caution';
  return 'safe';
}

function getLevelLabel(d) {
  if (d < 0) return '已过期';
  if (d <= 3) return '即将过期';
  if (d <= 7) return '临近过期';
  if (d <= 30) return '注意食用';
  return '新鲜安全';
}

function formatDate(iso) {
  const [y, m, d] = parseISO(iso);
  return y + '年' + m + '月' + d + '日';
}

function formatShelfLife(item) {
  const val = item.shelfLifeDays;
  const unit = item.shelfLifeUnit || 'day';
  if (unit === 'year') return '保质期 ' + val + ' 年';
  if (unit === 'month') return '保质期 ' + val + ' 个月';
  return '保质期 ' + val + ' 天';
}

// ── Supabase / Sync Engine ──

function initSupabase() {
  if (typeof window.supabase === 'undefined') {
    supabase = null;
    return;
  }
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function isOnline() { return navigator.onLine; }

// Convert Supabase row → local item format
function rowToItem(r) {
  return {
    id: r.id,
    name: r.name,
    productionDate: r.production_date,
    expiryDate: r.expiry_date,
    shelfLifeDays: r.shelf_life_days,
    shelfLifeUnit: r.shelf_life_unit || 'day',
    createdAt: r.created_at,
    updatedAt: r.updated_at || r.created_at
  };
}

// Convert local item → Supabase row
function itemToRow(item) {
  return {
    id: item.id,
    user_id: session.user.id,
    name: item.name,
    production_date: item.productionDate,
    expiry_date: item.expiryDate,
    shelf_life_days: item.shelfLifeDays,
    shelf_life_unit: item.shelfLifeUnit || 'day',
    created_at: item.createdAt,
    updated_at: item.updatedAt || item.createdAt
  };
}

function loadCache() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveCache(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch {}
}

function loadTombstones() {
  try { tombstones = JSON.parse(localStorage.getItem(TOMBSTONE_KEY)) || []; } catch { tombstones = []; }
}

function saveTombstones() {
  try { localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tombstones)); } catch {}
}

function loadSyncMeta() {
  try {
    const key = SYNC_META_KEY;
    syncMeta = JSON.parse(localStorage.getItem(key)) || null;
  } catch { syncMeta = null; }
}

function saveSyncMeta() {
  try { localStorage.setItem(SYNC_META_KEY, JSON.stringify(syncMeta)); } catch {}
}

function setSyncStatus(state) {
  const el = document.getElementById('sync-pill');
  if (!el) return;
  const map = {
    synced:  ['✓ 已同步', ''],
    syncing: ['⟳ 同步中…', ''],
    offline: ['📴 离线', 'offline'],
    error:   ['⚠ 同步失败', 'error'],
    local:   ['本机模式', 'local'],
  };
  const [text, cls] = map[state] || map.local;
  el.textContent = text;
  el.className = 'sync-pill ' + (cls || '');
}

async function syncNow() {
  if (!session || !supabase || !isOnline()) return;
  setSyncStatus('syncing');

  try {
    // Phase 1 — Pull all from server, merge by updatedAt (LWW)
    const { data: rows, error } = await supabase
      .from('food_items')
      .select('*')
      .eq('user_id', session.user.id);

    if (error) throw error;

    const serverMap = new Map((rows || []).map(r => [r.id, r]));
    const localMap = new Map(items.map(i => [i.id, i]));
    const tombSet = new Set(tombstones.map(t => t.id));

    // Push local items newer than server (or missing on server)
    for (const item of items) {
      const srv = serverMap.get(item.id);
      const itemUpd = item.updatedAt || item.createdAt;
      if (!srv || itemUpd > (srv.updated_at || srv.created_at)) {
        await supabase.from('food_items').upsert(itemToRow(item), { onConflict: 'id' });
      }
    }

    // Push deletes
    const surviving = [];
    for (const t of tombstones) {
      if (serverMap.has(t.id)) {
        await supabase.from('food_items').delete().eq('id', t.id).eq('user_id', session.user.id);
      }
      // If not on server, tombstone is stale — prune it
    }
    tombstones = []; // all processed
    saveTombstones();

    // Phase 2 — Merge server data into local (LWW)
    let changed = false;
    for (const [id, row] of serverMap) {
      if (tombSet.has(id)) continue; // was deleted locally before sync
      const local = localMap.get(id);
      const rowUpd = row.updated_at || row.created_at;
      if (!local) {
        items.push(rowToItem(row));
        changed = true;
      } else {
        const localUpd = local.updatedAt || local.createdAt;
        if (rowUpd > localUpd) {
          Object.assign(local, rowToItem(row));
          changed = true;
        }
      }
    }

    if (changed) {
      saveCache(items);
      renderFoodList();
    }

    syncMeta = syncMeta || {};
    syncMeta.lastSyncedAt = Date.now();
    saveSyncMeta();
    setSyncStatus('synced');
  } catch (e) {
    console.error('Sync error:', e);
    setSyncStatus('error');
  }
}

let syncTimer = null;
function scheduleSync() {
  if (!session || !supabase) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 800);
}

function markDirty(item) {
  item.updatedAt = Date.now();
}

// ── Data layer ──

function loadItems() {
  // Try cache first (instant load)
  items = loadCache();

  // Normalize legacy items (add updatedAt if missing)
  let normalized = false;
  for (const it of items) {
    if (!it.updatedAt) { it.updatedAt = it.createdAt || Date.now(); normalized = true; }
  }
  if (normalized) saveCache(items);

  // If logged in, schedule a cloud sync (will merge in background)
  if (session && supabase && isOnline()) {
    scheduleSync();
  }
}

function genId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// ── Toast ──

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── Tab switching ──

function switchTab(tabId) {
  // 从底部导航离开编辑视图时，自动退出编辑并复位表单
  if (editingId) exitEditMode();

  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navBtn = document.querySelector(`[data-tab="${tabId}"]`);
  if (navBtn) navBtn.classList.add('active');

  const hash = tabId === 'tab-add' ? '#add' : '#list';
  if (location.hash !== hash) {
    history.replaceState(null, '', hash);
  }

  if (tabId === 'tab-my') renderFoodList();
}

// ── Live preview + auto-fill expiry date ──

function updatePreview() {
  const prodDate = document.getElementById('prod-date').value;
  const days = parseInt(document.getElementById('shelf-life').value);
  const unit = getSelectedUnit();
  const expiryInput = document.getElementById('expiry-date');
  const preview = document.getElementById('expiry-preview');
  const text = document.getElementById('expiry-preview-text');

  if (prodDate && days > 0) {
    const expStr = addTimeISO(prodDate, days, unit);
    const isManual = expiryInput.dataset.manual === 'true';
    if (!isManual) expiryInput.value = expStr;
    if (isManual && expiryInput.value && expiryInput.value !== expStr) {
      const dl = daysUntil(expiryInput.value);
      text.textContent = '手动到期日：' + formatDate(expiryInput.value) + '（' + daysLeftLabel(dl) + '）';
    } else {
      const dl = daysUntil(expStr);
      text.textContent = '根据保质期计算：' + formatDate(expStr) + '（' + daysLeftLabel(dl) + '）';
    }
    preview.classList.remove('hidden');
  } else if (expiryInput.value) {
    const dl = daysUntil(expiryInput.value);
    text.textContent = '到期日：' + formatDate(expiryInput.value) + '（' + daysLeftLabel(dl) + '）';
    preview.classList.remove('hidden');
  } else {
    preview.classList.add('hidden');
  }
}

function getSelectedUnit() {
  const activeBtn = document.querySelector('#shelf-life-unit .unit-btn.active');
  return activeBtn ? activeBtn.dataset.unit : 'day';
}

// ── Add / Edit food（共享表单读取） ──

function readForm() {
  const name = document.getElementById('food-name').value.trim();
  if (!name) { showToast('请输入菜品名称'); return null; }

  const prodDate = document.getElementById('prod-date').value;
  const shelfLifeValue = parseInt(document.getElementById('shelf-life').value);
  const shelfLifeUnit = getSelectedUnit();
  const expiryInput = document.getElementById('expiry-date');
  const directExpiry = expiryInput.value;
  const isManualExpiry = expiryInput.dataset.manual === 'true';

  let finalExpiryDate, finalProdDate, finalShelfLife, finalShelfLifeUnit;

  if (isManualExpiry && directExpiry) {
    finalExpiryDate = directExpiry;
    finalShelfLifeUnit = shelfLifeUnit;
    if (prodDate) {
      finalProdDate = prodDate;
      finalShelfLife = computeShelfLife(prodDate, finalExpiryDate, shelfLifeUnit);
    } else {
      finalProdDate = '';      // 无生产日期 → 仅记录到期日
      finalShelfLife = 0;
    }
  } else if (prodDate && shelfLifeValue > 0) {
    finalProdDate = prodDate;
    finalShelfLife = shelfLifeValue;
    finalShelfLifeUnit = shelfLifeUnit;
    finalExpiryDate = addTimeISO(prodDate, shelfLifeValue, shelfLifeUnit);
  } else if (directExpiry) {
    finalExpiryDate = directExpiry;
    finalShelfLifeUnit = shelfLifeUnit;
    if (prodDate) {
      finalProdDate = prodDate;
      finalShelfLife = computeShelfLife(prodDate, finalExpiryDate, shelfLifeUnit);
    } else {
      finalProdDate = '';      // 无生产日期 → 仅记录到期日
      finalShelfLife = 0;
    }
  } else {
    showToast('请填写生产日期+保质期，或直接输入到期日期');
    return null;
  }

  return {
    name,
    productionDate: finalProdDate,
    expiryDate: finalExpiryDate,
    shelfLifeDays: finalShelfLife,
    shelfLifeUnit: finalShelfLifeUnit,
  };
}

function resetForm() {
  document.getElementById('food-name').value = '';
  document.getElementById('prod-date').value = todayISO();
  document.getElementById('shelf-life').value = '';
  document.getElementById('expiry-date').value = '';
  delete document.getElementById('expiry-date').dataset.manual;
  document.getElementById('expiry-preview').classList.add('hidden');
}

function pushToCloud(item) {
  if (session && supabase && isOnline()) {
    // Immediate push to cloud
    supabase.from('food_items').upsert(itemToRow(item), { onConflict: 'id' })
      .then(({ error }) => {
        if (!error) setSyncStatus('synced');
        else setSyncStatus('error');
      });
  } else if (session) {
    scheduleSync();
    showToast('📡 离线模式，联网后自动同步');
  }
}

function addFood() {
  const fields = readForm();
  if (!fields) return;

  const now = Date.now();
  const item = Object.assign({ id: genId(), createdAt: now, updatedAt: now }, fields);

  items.push(item);
  saveCache(items);
  showToast('✅ 「' + item.name + '」已添加');
  pushToCloud(item);

  resetForm();
  document.getElementById('food-name').focus();
}

// ── Edit existing item ──

function submitForm() {
  if (editingId) saveEdit();
  else addFood();
}

function startEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item) { showToast('未找到该菜品'); return; }

  // 先切到添加页视图（此时尚未进入编辑状态）
  switchTab('tab-add');
  editingId = id;

  document.getElementById('food-name').value = item.name;
  document.getElementById('prod-date').value = item.productionDate;
  document.getElementById('shelf-life').value = item.shelfLifeDays || '';
  document.getElementById('expiry-date').value = item.expiryDate;

  // 恢复单位选择
  const unit = item.shelfLifeUnit || 'day';
  document.querySelectorAll('#shelf-life-unit .unit-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.unit === unit);
  });
  const shelfInput = document.getElementById('shelf-life');
  if (unit === 'day') shelfInput.max = 3650;
  else if (unit === 'month') shelfInput.max = 120;
  else shelfInput.max = 10;

  // 到期日与「生产日期+保质期」计算一致 → 保持联动；
  // 否则视为手动到期日，保存时不被静默改写
  const expiryInput = document.getElementById('expiry-date');
  const computed = addTimeISO(item.productionDate, item.shelfLifeDays, unit);
  expiryInput.dataset.manual = (item.expiryDate === computed) ? 'false' : 'true';

  updatePreview();

  document.getElementById('edit-toolbar').classList.remove('hidden');
  document.getElementById('btn-submit').textContent = '💾 保存修改';
  window.scrollTo(0, 0);
}

function saveEdit() {
  const fields = readForm();
  if (!fields) return;

  const item = items.find(i => i.id === editingId);
  if (!item) { showToast('未找到该菜品'); exitEditMode(); return; }

  Object.assign(item, fields);
  markDirty(item);
  saveCache(items);
  showToast('✅ 「' + item.name + '」已保存修改');
  pushToCloud(item);

  exitEditMode();
  switchTab('tab-my'); // 返回列表
}

function cancelEdit() {
  exitEditMode();
  switchTab('tab-my');
}

function exitEditMode() {
  if (!editingId) return;
  editingId = null;
  document.getElementById('edit-toolbar').classList.add('hidden');
  document.getElementById('btn-submit').textContent = '✅ 添加菜品';
  resetForm();
}

// ── Delete with confirmation ──

function requestDelete(id) {
  pendingDeleteId = id;
  const item = items.find(i => i.id === id);
  document.getElementById('confirm-text').textContent =
    '确定要删除「' + (item ? item.name : '') + '」吗？此操作不可撤销。';
  document.getElementById('confirm-overlay').classList.remove('hidden');
}

function closeConfirm() {
  pendingDeleteId = null;
  document.getElementById('confirm-overlay').classList.add('hidden');
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  const item = items.find(i => i.id === pendingDeleteId);
  const id = pendingDeleteId;
  items = items.filter(i => i.id !== id);
  saveCache(items);

  // Queue tombstone for cloud sync
  tombstones.push({ id, deletedAt: Date.now() });
  saveTombstones();

  showToast('🗑️ 「' + (item ? item.name : '') + '」已删除');
  pendingDeleteId = null;
  document.getElementById('confirm-overlay').classList.add('hidden');
  renderFoodList();

  // Push delete to cloud
  if (session && supabase && isOnline()) {
    const { error } = await supabase.from('food_items').delete().eq('id', id).eq('user_id', session.user.id);
    if (!error) {
      tombstones = tombstones.filter(t => t.id !== id);
      saveTombstones();
      setSyncStatus('synced');
    } else {
      scheduleSync();
    }
  } else if (session) {
    scheduleSync();
  }
}

// ── Mark eaten ──

async function markEaten(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  items = items.filter(i => i.id !== id);
  saveCache(items);

  tombstones.push({ id, deletedAt: Date.now() });
  saveTombstones();

  showToast('🍽️ 「' + item.name + '」已食用完毕');
  renderFoodList();

  if (session && supabase && isOnline()) {
    const { error } = await supabase.from('food_items').delete().eq('id', id).eq('user_id', session.user.id);
    if (!error) {
      tombstones = tombstones.filter(t => t.id !== id);
      saveTombstones();
      setSyncStatus('synced');
    } else {
      scheduleSync();
    }
  } else if (session) {
    scheduleSync();
  }
}

// ── Clean all expired ──

async function cleanExpired() {
  const expired = items.filter(i => daysUntil(i.expiryDate) < 0);
  if (expired.length === 0) return;

  const count = expired.length;
  const ids = expired.map(i => i.id);
  items = items.filter(i => !ids.includes(i.id));
  saveCache(items);

  for (const id of ids) {
    tombstones.push({ id, deletedAt: Date.now() });
  }
  saveTombstones();

  showToast('🧹 已清理 ' + count + ' 个过期菜品');
  renderFoodList();

  if (session && supabase && isOnline()) {
    // Delete each from Supabase
    let anyFailed = false;
    for (const id of ids) {
      const { error } = await supabase.from('food_items').delete().eq('id', id).eq('user_id', session.user.id);
      if (!error) {
        tombstones = tombstones.filter(t => t.id !== id);
      } else {
        anyFailed = true;
      }
    }
    saveTombstones();
    setSyncStatus(anyFailed ? 'error' : 'synced');
  } else if (session) {
    scheduleSync();
  }
}

// ── Render food list (safe DOM construction) ──

function renderFoodList() {
  const listEl = document.getElementById('food-list');
  const emptyEl = document.getElementById('empty-state');
  const countEl = document.getElementById('list-count');
  const cleanBtn = document.getElementById('btn-clean-expired');

  const sorted = [...items].sort((a, b) => {
    const diff = daysUntil(a.expiryDate) - daysUntil(b.expiryDate);
    if (diff !== 0) return diff;
    return (a.createdAt || 0) - (b.createdAt || 0);
  });

  countEl.textContent = '共 ' + sorted.length + ' 件';
  const hasExpired = sorted.some(i => daysUntil(i.expiryDate) < 0);
  cleanBtn.classList.toggle('hidden', !hasExpired);

  if (sorted.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = '';
    updateBadge(0);
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = '';
  for (const item of sorted) {
    const dl = daysUntil(item.expiryDate);
    const level = getLevel(dl);
    const isExpired = dl < 0;

    const card = document.createElement('div');
    card.className = 'food-card ' + level;
    if (isExpired) card.classList.add('expired');

    const header = document.createElement('div');
    header.className = 'card-header';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'card-name';
    nameSpan.textContent = item.name;

    const tagSpan = document.createElement('span');
    tagSpan.className = 'card-tag';
    tagSpan.textContent = getLevelLabel(dl);

    const editBtn = document.createElement('button');
    editBtn.className = 'btn-edit';
    editBtn.textContent = '⋮';
    editBtn.setAttribute('aria-label', '编辑菜品');
    editBtn.addEventListener('click', () => startEdit(item.id));

    header.appendChild(nameSpan);
    header.appendChild(tagSpan);
    header.appendChild(editBtn);

    const dates = document.createElement('div');
    dates.className = 'card-dates';

    const expSpan = document.createElement('span');
    expSpan.textContent = '📅 ' + formatDate(item.expiryDate);
    const dotSpan = document.createElement('span');
    dotSpan.textContent = '·';
    const leftSpan = document.createElement('span');
    leftSpan.textContent = '⏳ ' + daysLeftLabel(dl);

    // 有生产日期 → 「生产日期 → 到期日期 · 保质期」；仅到期日 → 只展示到期日期
    if (item.productionDate) {
      const prodSpan = document.createElement('span');
      prodSpan.textContent = '🏭 ' + formatDate(item.productionDate);
      const arrowSpan = document.createElement('span');
      arrowSpan.textContent = '→';
      dates.appendChild(prodSpan);
      dates.appendChild(arrowSpan);
    }

    dates.appendChild(expSpan);
    dates.appendChild(dotSpan);

    if (item.productionDate && item.shelfLifeDays > 0) {
      const shelfSpan = document.createElement('span');
      shelfSpan.textContent = '📦 ' + formatShelfLife(item);
      const dotSpan2 = document.createElement('span');
      dotSpan2.textContent = '·';
      dates.appendChild(shelfSpan);
      dates.appendChild(dotSpan2);
    }

    dates.appendChild(leftSpan);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const eatBtn = document.createElement('button');
    eatBtn.className = 'btn-sm eat';
    eatBtn.textContent = '🍽️ 已食用';
    eatBtn.addEventListener('click', () => markEaten(item.id));

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-sm delete';
    delBtn.textContent = '🗑️ 删除';
    delBtn.addEventListener('click', () => requestDelete(item.id));

    actions.appendChild(eatBtn);
    actions.appendChild(delBtn);

    card.appendChild(header);
    card.appendChild(dates);
    card.appendChild(actions);
    listEl.appendChild(card);
  }

  const urgent = sorted.filter(i => daysUntil(i.expiryDate) <= 7).length;
  updateBadge(urgent);
}

function updateBadge(count) {
  const myTabBtn = document.querySelector('.nav-item[data-tab="tab-my"]');
  if (!myTabBtn) return;
  const iconWrap = myTabBtn.querySelector('.nav-icon');
  let badge = iconWrap ? iconWrap.querySelector('.nav-badge') : null;

  if (count > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'nav-badge';
      if (iconWrap) iconWrap.appendChild(badge);
    }
    badge.textContent = count > 99 ? '99+' : String(count);
  } else {
    if (badge) badge.remove();
  }
}

// ── Auth ──

function showAuthScreen() {
  const el = document.getElementById('auth-screen');
  if (!el) return; // 仅离线版本无登录界面
  el.classList.remove('hidden');
  document.getElementById('auth-error').textContent = '';
}

function hideAuthScreen() {
  const el = document.getElementById('auth-screen');
  if (el) el.classList.add('hidden');
}

function switchAuthTab(mode) {
  authMode = mode;
  document.querySelectorAll('[data-auth-tab]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-auth-tab="${mode}"]`).classList.add('active');
  document.getElementById('btn-auth-submit').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('auth-switch-hint').innerHTML = mode === 'login'
    ? '还没有账号？<button onclick="switchAuthTab(\'register\')">立即注册</button>'
    : '已有账号？<button onclick="switchAuthTab(\'login\')">去登录</button>';
  document.getElementById('auth-error').textContent = '';
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');

  if (!email || !password) { errEl.textContent = '请输入邮箱和密码'; return; }
  if (password.length < 6) { errEl.textContent = '密码至少需要 6 位'; return; }

  errEl.textContent = '';
  const btn = document.getElementById('btn-auth-submit');
  btn.disabled = true;

  try {
    if (!supabase) { errEl.textContent = '云服务未配置，请设置 Supabase 密钥'; btn.disabled = false; return; }

    const { data, error } = authMode === 'login'
      ? await supabase.auth.signInWithPassword({ email, password })
      : await supabase.auth.signUp({ email, password });

    if (error) {
      // Friendlier messages for common cases
      if (authMode === 'register' && /already registered|already exists/i.test(error.message)) {
        switchAuthTab('login');
        errEl.textContent = '该邮箱已注册，请直接登录';
      } else if (/Email not confirmed/i.test(error.message)) {
        errEl.textContent = '邮箱未确认。请在 Supabase SQL Editor 运行确认 SQL，或换一个邮箱注册';
      } else if (/Invalid login credentials/i.test(error.message)) {
        errEl.textContent = '邮箱或密码错误';
      } else {
        errEl.textContent = error.message || '操作失败，请重试';
      }
      btn.disabled = false;
      return;
    }

    if (authMode === 'register' && data.user && !data.session) {
      errEl.textContent = '注册成功！请查收验证邮件后登录';
    } else if (data.session) {
      // Signup auto-login or login success — call handleSignedIn directly as a
      // safety net (onAuthStateChange may also fire; handleSignedIn is idempotent)
      handleSignedIn(data.session.user);
    }
  } catch (e) {
    errEl.textContent = e.message || '操作失败，请重试';
  }
  btn.disabled = false;
}

async function handleSignedIn(newSession) {
  session = newSession;
  loadSyncMeta();

  // Account isolation: different user → clear local cache
  if (syncMeta && syncMeta.userId && syncMeta.userId !== session.user.id) {
    items = [];
    tombstones = [];
    saveCache(items);
    saveTombstones();
    loadSyncMeta();
    syncMeta = null;
  }

  if (!syncMeta) {
    syncMeta = { userId: session.user.id, lastSyncedAt: null, migrationHandled: false };
  }
  syncMeta.userId = session.user.id;
  saveSyncMeta();

  hideAuthScreen();

  // Show user info
  document.getElementById('user-bar').classList.remove('hidden');
  document.getElementById('user-email').textContent = session.user.email;
  setSyncStatus('syncing');

  // Load cached data + sync from cloud
  loadItems();
  renderFoodList();

  // Check if migration needed
  if (items.length > 0 && !syncMeta.migrationHandled) {
    document.getElementById('migrate-count').textContent = items.length;
    document.getElementById('migrate-overlay').classList.remove('hidden');
  } else {
    syncNow();
  }
}

async function handleLogout() {
  if (supabase && session) {
    await supabase.auth.signOut();
  }
  session = null;
  document.getElementById('user-bar').classList.add('hidden');
  document.getElementById('sync-pill').className = 'sync-pill local';
  document.getElementById('sync-pill').textContent = '本机模式';
  showAuthScreen();
  showToast('已退出登录，本地数据已保留');
}

function enterOfflineMode() {
  hideAuthScreen();
  setSyncStatus('local');
  document.getElementById('user-bar').classList.remove('hidden');
  document.getElementById('user-email').textContent = '离线模式';
  loadItems();
  renderFoodList();
  showToast('📡 离线模式，数据保存在本机');
}

// ── Migration ──

async function doMigration() {
  document.getElementById('migrate-overlay').classList.add('hidden');

  if (!session || !supabase || !isOnline()) {
    showToast('请联网后再试');
    return;
  }

  const rows = items.map(itemToRow);
  setSyncStatus('syncing');

  try {
    // Batch insert in chunks of 50
    for (let i = 0; i < rows.length; i += 50) {
      const chunk = rows.slice(i, i + 50);
      const { error } = await supabase.from('food_items').upsert(chunk, { onConflict: 'id' });
      if (error) throw error;
    }
    syncMeta.migrationHandled = true;
    saveSyncMeta();
    setSyncStatus('synced');
    showToast('✅ 已同步 ' + rows.length + ' 件菜品到云端');
  } catch (e) {
    setSyncStatus('error');
    showToast('⚠️ 迁移失败：' + (e.message || '未知错误'));
  }
}

function skipMigration() {
  document.getElementById('migrate-overlay').classList.add('hidden');
  syncMeta.migrationHandled = true;
  saveSyncMeta();
  if (session && supabase && isOnline()) syncNow();
}

// ── Init ──

function wireForm() {
  document.getElementById('prod-date').value = todayISO();

  document.getElementById('prod-date').addEventListener('input', () => {
    document.getElementById('expiry-date').dataset.manual = 'false';
    updatePreview();
  });
  document.getElementById('shelf-life').addEventListener('input', () => {
    document.getElementById('expiry-date').dataset.manual = 'false';
    updatePreview();
  });
  document.getElementById('expiry-date').addEventListener('input', () => {
    document.getElementById('expiry-date').dataset.manual = 'true';
    updatePreview();
  });

  document.getElementById('food-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitForm();
  });

  document.querySelectorAll('#shelf-life-unit .unit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#shelf-life-unit .unit-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const shelfInput = document.getElementById('shelf-life');
      const unit = btn.dataset.unit;
      if (unit === 'day') shelfInput.max = 3650;
      else if (unit === 'month') shelfInput.max = 120;
      else shelfInput.max = 10;
      updatePreview();
    });
  });
}

// ── Supabase SDK dynamic loader (never blocks the app) ──

let sdkLoadPromise = null;
function ensureSupabaseSDK(timeoutMs) {
  if (typeof window.supabase !== 'undefined') return Promise.resolve(true);
  if (sdkLoadPromise) return sdkLoadPromise;

  sdkLoadPromise = new Promise(resolve => {
    // Local copy first — works without any CDN
    const s = document.createElement('script');
    s.src = 'supabase.min.js';
    const timer = setTimeout(() => { s.remove(); resolve(false); }, timeoutMs || 10000);
    s.onload = () => { clearTimeout(timer); resolve(true); };
    s.onerror = () => {
      // Fallback to CDN if local file missing
      clearTimeout(timer);
      s.remove();
      const s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
      const timer2 = setTimeout(() => { s2.remove(); resolve(false); }, 8000);
      s2.onload = () => { clearTimeout(timer2); resolve(true); };
      s2.onerror = () => { clearTimeout(timer2); resolve(false); };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
  return sdkLoadPromise;
}

function boot() {
  loadTombstones();
  items = loadCache();
  // Normalize legacy items
  let normalized = false;
  for (const it of items) {
    if (!it.updatedAt) { it.updatedAt = it.createdAt || Date.now(); normalized = true; }
  }
  if (normalized) saveCache(items);

  wireForm();

  // Restore tab from URL hash
  const hash = location.hash;
  if (hash === '#list') {
    switchTab('tab-my');
  } else {
    switchTab('tab-add');
    if (!hash) history.replaceState(null, '', '#add');
  }

  // 仅离线模式：不加载云服务，直接进入本机模式
  enterOfflineMode();
}

function checkSession() {
  // Timeout fallback: if Supabase is unreachable, show auth screen after 5s
  let authResolved = false;
  const authTimeout = setTimeout(() => {
    if (!authResolved) {
      authResolved = true;
      showAuthScreen();
      loadItems();
      renderFoodList();
    }
  }, 5000);

  supabase.auth.getSession()
    .then(({ data }) => {
      if (authResolved) return;
      authResolved = true;
      clearTimeout(authTimeout);

      if (data.session) {
        handleSignedIn(data.session.user);
      } else {
        showAuthScreen();
        loadItems();
        renderFoodList();
      }
    })
    .catch(() => {
      if (authResolved) return;
      authResolved = true;
      clearTimeout(authTimeout);
      // Supabase unreachable — show auth screen, user can go offline
      showAuthScreen();
      loadItems();
      renderFoodList();
    });

  // Listen for auth state changes
  supabase.auth.onAuthStateChange((event, ses) => {
    if (event === 'SIGNED_IN' && ses) {
      handleSignedIn(ses.user);
    } else if (event === 'SIGNED_OUT') {
      session = null;
      document.getElementById('user-bar').classList.add('hidden');
      showAuthScreen();
    }
  });
}

// ── Day-rollover + sync on resume ──

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const tabMy = document.getElementById('tab-my');
    if (tabMy && tabMy.classList.contains('active')) {
      renderFoodList();
    }
    const today = todayISO();
    const prodEl = document.getElementById('prod-date');
    // 编辑中不自动回填，避免覆盖用户清空的生产日期
    if (prodEl && !prodEl.value && !editingId) prodEl.value = today;

    // Sync on return to app
    if (session && supabase && isOnline()) syncNow();
  }
});

window.addEventListener('pageshow', () => {
  const tabMy = document.getElementById('tab-my');
  if (tabMy && tabMy.classList.contains('active')) {
    renderFoodList();
  }
});

window.addEventListener('online', () => {
  if (session && supabase) {
    setSyncStatus('syncing');
    syncNow();
  }
  showToast('📡 网络已恢复');
});

window.addEventListener('offline', () => {
  if (session) setSyncStatus('offline');
  showToast('📡 已切换到离线模式');
});

// ── Storage sync across tabs ──

window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY) {
    items = loadCache();
    const tabMy = document.getElementById('tab-my');
    if (tabMy && tabMy.classList.contains('active')) {
      renderFoodList();
    }
  }
});

// ── Bootstrap ──

document.addEventListener('DOMContentLoaded', boot);

// ── Service Worker registration (progressive enhancement) ──

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
