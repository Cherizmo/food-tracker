<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Leaf body -->
  <g transform="translate(256,240)">
    <ellipse cx="0" cy="0" rx="90" ry="110" fill="#86EFAC" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="90" ry="110" fill="#4ADE80" transform="rotate(15)"/>
    <!-- Center vein -->
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
    <!-- Side veins -->
    <line x1="0" y1="-60" x2="-35" y2="-75" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="-40" y2="-30" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="-35" y2="15" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-60" x2="35" y2="-75" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="40" y2="-30" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="35" y2="15" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <!-- Stem -->
    <path d="M0,-105 Q5,-140 25,-155" stroke="#22C55E" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Calendar overlay -->
  <g transform="translate(340,340)">
    <rect x="-55" y="-50" width="110" height="100" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-55" y="-50" width="110" height="28" rx="16" fill="#EF4444"/>
    <rect x="-55" y="-30" width="110" height="10" fill="#EF4444"/>
    <text x="0" y="-28" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#FFFFFF">保质</text>
    <text x="0" y="12" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="#1E293B">📅 到期</text>
    <text x="0" y="36" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#64748B">提醒</text>
  </g>
  <!-- Checkmark badge -->
  <circle cx="370" cy="170" r="40" fill="#22C55E" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M350,170 L365,185 L390,155" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
